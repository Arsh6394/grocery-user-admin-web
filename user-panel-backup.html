<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0f0f13;
    --sidebar:#16161d;
    --card:#1c1c26;
    --card2:#22222f;
    --accent:#7c6ef5;
    --accent2:#5dcaa5;
    --accent3:#f0997b;
    --accent4:#f4c0d1;
    --text:#e8e8f0;
    --muted:#7b7b96;
    --border:#2a2a3a;
    --success:#5dcaa5;
    --warning:#EF9F27;
    --danger:#E24B4A;
    --info:#378ADD;
  }
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);display:flex;min-height:100vh;overflow-x:hidden}
  
  /* SIDEBAR */
  .sidebar{width:220px;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;min-height:100vh}
  .sidebar-logo{padding:24px 20px 20px;border-bottom:1px solid var(--border)}
  .logo-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;margin-right:8px}
  .logo-text{font-size:16px;font-weight:600;color:var(--text);letter-spacing:-0.3px}
  .logo-sub{font-size:11px;color:var(--muted);margin-top:2px;padding-left:16px}
  .nav{padding:12px 0;flex:1}
  .nav-section{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:12px 20px 6px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;font-size:13px;color:var(--muted);border-left:2px solid transparent;transition:all 0.15s}
  .nav-item:hover{color:var(--text);background:rgba(124,110,245,0.06)}
  .nav-item.active{color:var(--accent);border-left-color:var(--accent);background:rgba(124,110,245,0.1)}
  .nav-icon{width:18px;height:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .badge-pill{margin-left:auto;background:var(--danger);color:#fff;border-radius:20px;padding:1px 7px;font-size:10px;font-weight:600}
  .sidebar-footer{padding:16px 20px;border-top:1px solid var(--border)}
  .user-row{display:flex;align-items:center;gap:10px}
  .user-av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex-shrink:0}
  .user-name{font-size:13px;font-weight:500;color:var(--text)}
  .user-role{font-size:11px;color:var(--muted)}
  .online-dot{width:8px;height:8px;background:var(--success);border-radius:50%;margin-left:auto;flex-shrink:0}

  /* MAIN */
  .main{flex:1;display:flex;flex-direction:column;overflow:auto}
  .topbar{background:var(--sidebar);border-bottom:1px solid var(--border);padding:0 28px;height:56px;display:flex;align-items:center;gap:16px;flex-shrink:0}
  .topbar-title{font-size:15px;font-weight:500;color:var(--text)}
  .topbar-search{flex:1;max-width:300px;margin-left:auto}
  .search-input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 14px;font-size:13px;color:var(--text);outline:none}
  .search-input::placeholder{color:var(--muted)}
  .search-input:focus{border-color:var(--accent)}
  .topbar-btn{width:36px;height:36px;border-radius:8px;background:var(--card);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--muted)}
  .notif-dot{position:relative}
  .notif-dot::after{content:'';position:absolute;top:6px;right:6px;width:6px;height:6px;background:var(--danger);border-radius:50%;border:1px solid var(--sidebar)}
  .content{padding:24px 28px;flex:1}
  .section{display:none}
  .section.active{display:block}

  /* STAT CARDS */
  .stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;position:relative;overflow:hidden;cursor:default;transition:border-color 0.15s}
  .stat:hover{border-color:var(--accent)}
  .stat-accent{position:absolute;top:0;right:0;width:60px;height:60px;border-radius:0 12px 0 60px;opacity:0.15}
  .stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px}
  .stat-val{font-size:26px;font-weight:600;color:var(--text);line-height:1}
  .stat-change{font-size:12px;margin-top:8px;display:flex;align-items:center;gap:4px}
  .up{color:var(--success)}.down{color:var(--danger)}.neutral{color:var(--muted)}
  .stat-icon{position:absolute;top:18px;right:18px;font-size:20px;opacity:0.5}

  /* SCROLLBAR */
  ::-webkit-scrollbar{width:4px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
</style>
</head>
<body>
  <div style="display:flex;justify-content:center;align-items:center;width:100%;height:100%;flex-direction:column;gap:20px">
    <h1 style="color:var(--text)">User Panel (Backup)</h1>
    <p style="color:var(--muted)">Code saved successfully</p>
  </div>
</body>
</html>
