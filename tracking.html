<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Tracking - FreshMart</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Fraunces:ital,wght@0,700;0,900;1,700&display=swap" rel="stylesheet">
<style>
:root {
  --green: #2d8c4e;
  --green-dark: #1e6338;
  --green-light: #e8f5ec;
  --text: #1a1a1a;
  --text-mid: #4a5568;
  --border: #e8f0e4;
  --white: #ffffff;
  --off-white: #fafaf7;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Nunito', sans-serif; background: var(--off-white); }

.topbar {
  background: var(--green);
  color: #fff;
  padding: 7px 60px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12.5px;
  font-weight: 600;
}

nav {
  background: #fff;
  padding: 0 60px;
  display: flex;
  align-items: center;
  gap: 24px;
  position: sticky;
  top: 0;
  z-index: 1000;
  box-shadow: 0 2px 20px rgba(0,0,0,0.07);
  height: 70px;
}

.logo {
  font-family: 'Fraunces', serif;
  font-size: 26px;
  font-weight: 900;
  color: var(--green);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 8px;
}

.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 50px 40px;
}

.tracking-title {
  font-family: 'Fraunces', serif;
  font-size: 38px;
  font-weight: 900;
  margin-bottom: 32px;
  text-align: center;
}

.tracking-card {
  background: var(--white);
  border-radius: 16px;
  padding: 32px;
  box-shadow: 0 2px 16px rgba(0,0,0,0.05);
  margin-bottom: 24px;
}

.order-header {
  background: var(--green-light);
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.order-id-text {
  font-weight: 800;
  color: var(--green);
  font-size: 16px;
}

.order-status-badge {
  display: inline-block;
  background: var(--green);
  color: white;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 800;
  text-transform: uppercase;
}

.timeline {
  position: relative;
  padding-left: 40px;
}

.timeline::before {
  content: '';
  position: absolute;
  left: 10px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--border);
}

.timeline-item {
  position: relative;
  margin-bottom: 28px;
  padding-bottom: 12px;
}

.timeline-item::before {
  content: '✓';
  position: absolute;
  left: -35px;
  top: 0;
  width: 20px;
  height: 20px;
  background: var(--green);
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 800;
}

.timeline-item.pending::before {
  background: var(--text-light);
  content: '';
}

.timeline-status {
  font-weight: 800;
  color: var(--text);
  font-size: 14px;
  margin-bottom: 4px;
}

.timeline-message {
  color: var(--text-mid);
  font-size: 13px;
  margin-bottom: 2px;
}

.timeline-time {
  font-size: 11px;
  color: var(--text-light);
}

.order-details {
  background: var(--off-white);
  padding: 20px;
  border-radius: 12px;
  margin-top: 24px;
}

.details-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
  margin-bottom: 20px;
}

.detail-item {
  display: flex;
  flex-direction: column;
}

.detail-label {
  font-size: 12px;
  font-weight: 700;
  color: var(--text-mid);
  text-transform: uppercase;
  margin-bottom: 4px;
}

.detail-value {
  font-size: 15px;
  font-weight: 800;
  color: var(--text);
}

.items-section {
  margin-top: 24px;
  padding-top: 24px;
  border-top: 2px solid var(--border);
}

.items-title {
  font-size: 16px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 14px;
}

.item-row {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
}

.item-row:last-child {
  border-bottom: none;
}

.item-name {
  font-weight: 600;
  color: var(--text);
}

.item-qty {
  color: var(--text-mid);
}

.item-price {
  color: var(--green);
  font-weight: 700;
}

.action-buttons {
  display: flex;
  gap: 12px;
  margin-top: 20px;
}

.btn {
  flex: 1;
  padding: 12px;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 800;
  cursor: pointer;
  text-transform: uppercase;
  transition: all 0.3s;
}

.btn-primary {
  background: var(--green);
  color: white;
}

.btn-primary:hover {
  background: var(--green-dark);
}

.btn-secondary {
  background: var(--off-white);
  color: var(--text);
  border: 2px solid var(--border);
}

.btn-secondary:hover {
  border-color: var(--green);
  background: var(--green-light);
}

.empty-state {
  text-align: center;
  padding: 60px 20px;
}

.empty-icon {
  font-size: 48px;
  margin-bottom: 16px;
}

.empty-title {
  font-size: 22px;
  font-weight: 800;
  color: var(--text);
  margin-bottom: 8px;
}

.empty-text {
  color: var(--text-mid);
  font-size: 14px;
  margin-bottom: 24px;
}

@media (max-width: 640px) {
  .details-grid {
    grid-template-columns: 1fr;
  }

  .order-header {
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
  }

  .action-buttons {
    flex-direction: column;
  }
}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div>Track your order in real-time 📍</div>
  <div>Support: support@freshmart.in</div>
</div>

<!-- NAVBAR -->
<nav>
  <div class="logo" onclick="window.location='grocery.html'"><span style="font-size: 24px;">🛍️</span> FreshMart</div>
</nav>

<!-- MAIN CONTENT -->
<div class="container">
  <h1 class="tracking-title">📍 Order Tracking</h1>
  <div id="trackResult"></div>
</div>

<script src="https://www.gstatic.com/firebaseapp/8.6.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebaseapp/8.6.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebaseapp/8.6.0/firebase-firestore.js"></script>
<script src="js/firebase-config.js"></script>

<script>
// Load order from URL parameter
document.addEventListener('DOMContentLoaded', async () => {
  const urlParams = new URLSearchParams(window.location.search);
  const orderId = urlParams.get('orderId');

  if (orderId) {
    await loadOrderTracking(orderId);
  } else {
    document.getElementById('trackResult').innerHTML = `
      <div class="tracking-card">
        <div class="empty-state">
          <div class="empty-icon">📦</div>
          <h2 class="empty-title">No Order to Track</h2>
          <p class="empty-text">Use the order ID from your email to track your order.</p>
          <div style="margin-top: 20px;">
            <input type="text" id="orderIdInput" placeholder="Enter Order ID (e.g., ORD-123456)" style="padding: 10px 14px; border: 2px solid var(--border); border-radius: 8px; width: 100%; max-width: 300px; font-size: 13px;">
            <button onclick="searchOrder()" style="background: var(--green); color: white; border: none; padding: 10px 24px; border-radius: 8px; margin-top: 12px; cursor: pointer; font-weight: 800;">Search Order</button>
          </div>
        </div>
      </div>
    `;
  }
});

// Search order
async function searchOrder() {
  const orderId = document.getElementById('orderIdInput').value.trim();
  if (!orderId) {
    alert('Please enter an Order ID');
    return;
  }
  await loadOrderTracking(orderId);
}

// Repeat order
async function repeatOrder(orderId) {
  try {
    const orderDoc = await db.collection('orders').doc(orderId).get();
    if (!orderDoc.exists) {
      alert('Order not found');
      return;
    }
    const order = orderDoc.data();

    if (!currentUser) {
      alert('Please login to add items to cart');
      window.location = 'auth.html';
      return;
    }

    // Add items to cart
    for (const item of order.items) {
      await addToCartFirebase(item.productId, item.productName, item.price, item.qty);
    }

    alert('✓ Order items added to cart!');
    setTimeout(() => window.location = 'cart.html', 500);
  } catch (error) {
    alert('Error repeating order: ' + error.message);
  }
}
</script>

</body>
</html>
